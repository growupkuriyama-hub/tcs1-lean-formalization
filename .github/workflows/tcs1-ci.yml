name: TCS1 Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tcs1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tcs1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build v128 finite-rule delta first
        run: |
          lake build \
            LeanCfgProject.TCS1.V128SubstringUnaryRuleTable \
            LeanCfgProject.TCS1.V128SubstringRemainingRuleTables \
            LeanCfgProject.TCS1.V128SubstringTabulatedGrammar \
            LeanCfgProject.TCS1.V128SubstringBinarySplitSlots

      - name: Build theorem-facing critical path
        run: |
          lake build \
            LeanCfgProject.TCS1.V83LevelCodedDifferenceCore \
            LeanCfgProject.TCS1.V83LevelCodedOccurrenceKernel \
            LeanCfgProject.TCS1.V83LevelCodedCleanOccurrence \
            LeanCfgProject.TCS1.V83LevelCodedSubstitutabilityBridge \
            LeanCfgProject.TCS1.V83MixedDerivationInversion \
            LeanCfgProject.TCS1.V83LevelCodedIndexedGrammarExact \
            LeanCfgProject.TCS1.V83LevelCodedMinusIndexedGrammarExact \
            LeanCfgProject.TCS1.V83LevelCodedIndexedThickness \
            LeanCfgProject.TCS1.V83LevelCodedIndexedReducedness \
            LeanCfgProject.TCS1.V83LevelCodedIndexedSize \
            LeanCfgProject.TCS1.V83OrdinaryThicknessIndexedPackage \
            LeanCfgProject.TCS1.V86FullManuscriptAudit \
            LeanCfgProject.TCS1.V87FullManuscriptAudit \
            LeanCfgProject.TCS1.V88FullManuscriptAudit

      - name: Build TCS1 facade
        run: lake build LeanCfgProject.TCS1.All

      - name: Reject sorry in TCS1
        run: |
          if grep -R -nE '\bsorry\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::sorry found in TCS1 Lean files"
            exit 1
          fi

      - name: Reject project-level axiom in TCS1
        run: |
          if grep -R -nE '^[[:space:]]*axiom\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::axiom found in TCS1 Lean files"
            exit 1
          fi
