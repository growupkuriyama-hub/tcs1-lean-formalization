name: TCS1 v115 fast check

on:
  push:
    branches:
      - tcs1-v115-reverification
  workflow_dispatch:

jobs:
  v115:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build v115 delta
        run: |
          lake build \
            LeanCfgProject.TCS1.V115FiniteInformationClosure \
            LeanCfgProject.TCS1.V115InverseHomClosure \
            LeanCfgProject.TCS1.V115LocallyTrivialWindows \
            LeanCfgProject.TCS1.V115LocallyTrivialForwardReduction \
            LeanCfgProject.TCS1.V115LocallyTrivialThickness \
            LeanCfgProject.TCS1.V115PositiveIdempotentIdeal \
            LeanCfgProject.TCS1.V115FinitePositivePowers \
            LeanCfgProject.TCS1.V115PositiveImageCardinal \
            LeanCfgProject.TCS1.V115LocalConsequences \
            LeanCfgProject.TCS1.V115LocalThicknessBound
